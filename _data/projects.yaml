- title: Continuous 2011-2022 PM2.5 in East Asia at daily 2-km resolution
  link: https://doi.org/10.7910/DVN/0GO7BS
  description: We construct a continuous 24-h daily fine particulate matter (PM2.5) record with 2×2 km2 resolution over eastern China, South Korea, and Japan for 2011-2022 by applying a random forest (RF) algorithm to aerosol optical depth (AOD) observations from the Geostationary Ocean Color Imager (GOCI) I and II satellite instruments
